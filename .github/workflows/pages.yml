name: Pages

# Deploys site/ to GitHub Pages from the github-pages-site branch. site/media holds symbolic
# links to the showcase GIFs and the demo reel; the copy resolves them.
on:
  push:
    branches: [github-pages-site]
    paths:
      - site/**
      - demos/examples/resources/gifs/**
      - combined_demo_reel.mp4
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the site
        run: |
          cp -rL site _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
