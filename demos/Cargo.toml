[package]
name = "multicalc-demos"
version.workspace = true
edition.workspace = true
# Rerun requires Rust 1.92, above the workspace 1.85 floor, so this crate sets its own.
rust-version = "1.92"
license.workspace = true
publish = false
autoexamples = false

[features]
default = ["rerun", "alloc"]
rerun = ["dep:rerun"]
# Turns on multicalc's heap types (the particle filter), used by the estimation example's extra
# section and the 2D localization and obstacle avoidance showcase (its localizer and lap driver).
alloc = ["multicalc/alloc"]

[dependencies]
# The simulated world is built on `mapping::DynamicOccupancyGrid`, which is heap-backed, so the
# demos always need multicalc's `alloc`. The demos' own `alloc` feature stays as the gate for the
# heavier demo code (the particle-filter localizer and the lap driver).
multicalc = { path = "../crates/multicalc", features = ["alloc"] }
# Reads MuJoCo and URDF model files into multicalc types, for the model-ingestion examples.
multicalc-robot-model = { path = "../crates/multicalc-robot-model" }
# Seeded RNG for the sensor simulator, so a run reproduces exactly. Showcase-side only; the core
# crate stays rand-free. `rand_distr` supplies the Gaussian, which `rand` itself does not carry.
rand = "0.10.2"
rand_distr = "0.6.0"
rand_pcg = "0.10.2"
# Pinned to match the paired Rerun viewer version. Only the logging SDK is needed: `spawn()`
# launches the external viewer on PATH, so the in-process `native_viewer` is not compiled in.
rerun = { version = "=0.33.1", default-features = false, features = ["sdk"], optional = true }

[lints]
workspace = true

