[package]
name = "multicalc"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Robotics for microcontrollers. Sense, plan, estimate and control in no_std Rust in one integrated package. Tested on real hardware: run the same code from your laptop to a Cortex-M4."
repository.workspace = true
license.workspace = true
documentation = "https://docs.rs/multicalc"
readme = "README.md"
keywords = ["no-std", "autodiff", "calculus", "embedded", "robotics"]
categories = ["mathematics", "no-std", "no-std::no-alloc", "embedded", "science::robotics"]

[dependencies]
libm = "0.2"

[target.'cfg(not(target_arch = "arm"))'.dev-dependencies]
rand = "0.8"
proptest = "1.11"
multicalc-testkit = { path = "../../tools/testkit" }

[features]
default = []
alloc = []

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
