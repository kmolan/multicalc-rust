[package]
name = "multicalc-robot-model"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Loads MuJoCo MJCF and URDF robot models into multicalc types"
repository.workspace = true
license.workspace = true
publish = false
# The viewer binary is declared explicitly below, so it is the only one.
autobins = false

[dependencies]
multicalc = { path = "../multicalc", version = "0.10.0" }
roxmltree = "0.21"
rerun = { version = "=0.33.1", default-features = false, features = ["sdk"] }

[[bin]]
name = "model_viewer"
path = "src/bin/model_viewer.rs"

[lints]
workspace = true
