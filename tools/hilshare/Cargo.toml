# multicalc as Tock apps for HILShare: three apps (Cargo features `arm`, `drone`,
# `mobile_and_policy`) run the checks of multicalc as a Tock process on the three HILShare boards
# and print the HILShare markers. Dev-only and never published. Its own workspace: build-tab.sh
# builds each app one time for each board, at the fixed app addresses of that kernel, with the
# linker script of libtock-rs, on a pinned toolchain (rust-toolchain.toml).
[workspace]

[package]
name = "multicalc-hilshare"
version = "0.5.0"
edition = "2024"
rust-version = "1.92"
authors = ["akathail <anmolkathail@gmail.com>"]
description = "Runs the checks of multicalc as three Tock apps and reports them as HILShare markers"
license = "MIT"
publish = false

[dependencies]
multicalc = { path = "../../crates/multicalc", default-features = false }
libtock = { git = "https://github.com/tock/libtock-rs", rev = "b7f17591e43607474958ed7d117ba831e54e1017" }

[build-dependencies]
libtock_build_scripts = { git = "https://github.com/tock/libtock-rs", rev = "b7f17591e43607474958ed7d117ba831e54e1017" }

# One app for each build. elf2tab pads a Cortex-M TBF to a power of two, and the Nucleo-F411RE
# app region is 256 KB, so one app cannot hold every check.
[features]
# The math checks and the Franka Panda checks.
arm = []
# The Skydio X2 checks and the ESKF trajectory.
drone = []
# The mobile-robot tick and the MLP policy.
mobile_and_policy = []

# A cycle count of an unoptimized build tells nothing. libtock-rs has no unwinder.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = true
panic = "abort"
