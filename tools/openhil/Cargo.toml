# multicalc as a Tock app for OpenHIL: runs checks on a Nucleo-F411RE as a Tock process and
# prints the OpenHIL markers. Dev-only and never published. Its own workspace: it builds for
# thumbv7em-none-eabi with libtock-rs's linker script, at the OpenHIL kernel's fixed app
# addresses (.cargo/config.toml), on a pinned toolchain (rust-toolchain.toml).
[workspace]

[package]
name = "multicalc-openhil"
version = "0.3.0"
edition = "2024"
rust-version = "1.92"
authors = ["akathail <anmolkathail@gmail.com>"]
description = "Runs multicalc's checks as a Tock app and reports them as OpenHIL markers"
license = "MIT"
publish = false

[dependencies]
multicalc = { path = "../../crates/multicalc", default-features = false }
libtock = { git = "https://github.com/tock/libtock-rs", rev = "b7f17591e43607474958ed7d117ba831e54e1017" }

[build-dependencies]
libtock_build_scripts = { git = "https://github.com/tock/libtock-rs", rev = "b7f17591e43607474958ed7d117ba831e54e1017" }

[features]
# Moves `vector_dot`'s expected answer, so the run reports FAIL.
fail = []
# Adds work inside `vector_dot`'s timed section, so the run reports FAIL on its budget with
# the right answer.
slow = []

# Cycle counts mean nothing unoptimized. libtock-rs has no unwinder.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = true
panic = "abort"
